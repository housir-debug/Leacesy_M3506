<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrument</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/png" href="./icon/leacesylogo.png">
</head>
<body>
    <div class="container">
        <div id="header-container"></div>

        <main>
            <section class="scpi-control" aria-labelledby="scpi-title">
                <div class="scpi-layout">
                    <aside class="command-sidebar">
                        <h2>
                            <svg class="console-section-icon" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                                stroke-linejoin="round" aria-hidden="true">
                                <path d="M8 6h12M8 12h12M8 18h12"/>
                                <circle cx="4" cy="6" r="1"/>
                                <circle cx="4" cy="12" r="1"/>
                                <circle cx="4" cy="18" r="1"/>
                            </svg>
                            <span>Commands List</span>
                        </h2>
                        <div class="command-list-frame">
                            <div id="command-list" class="command-list"></div>
                            <p id="command-list-status" class="command-list-status" role="status">正在加载命令...</p>
                        </div>
                        <input id="command-search" class="command-search" type="search"
                            placeholder="搜索命令..." aria-label="模糊搜索 SCPI 命令">
                    </aside>

                    <section class="console-main">
                        <div class="console-heading">
                            <h2 id="scpi-title">
                                <svg class="console-section-icon" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true">
                                    <rect x="3" y="4" width="18" height="16" rx="3"/>
                                    <path d="m8 10 3 2-3 2M13 14h3"/>
                                </svg>
                                <span>SCPI Command Control</span>
                            </h2>
                        </div>
                        <div class="command-input-area">
                            <input type="text" id="command-input" autocomplete="off"
                                aria-label="SCPI 命令" placeholder="输入 SCPI 命令..." spellcheck="false">
                            <button id="send-button" class="primary" type="button">发送</button>
                        </div>
                        <div class="output-area" id="output" role="log" aria-live="polite" aria-label="命令输出">
                            <div class="output-line info">等待命令</div>
                        </div>
                    </section>
                </div>
            </section>
        </main>
    </div>

    <script src="./js/header.js"></script>
    <script src="./js/index.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            sharedComponents.loadHeader('header-container', 'console');
        });
    </script>
</body>
</html>
